name: Build Perfetto (Linux + Windows Native)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # 阶段 1：在 Linux 上编译 UI
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Perfetto
        uses: actions/checkout@v4
        with:
          repository: google/perfetto
          fetch-depth: 1
          path: perfetto

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Perfetto UI
        working-directory: ./perfetto
        run: |
          uv run python3 tools/install-build-deps --ui
          ./ui/build

      - name: Upload UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfetto-ui-dist
          path: perfetto/out/ui/ui/dist

  # 阶段 2：在 Windows 上原生打包 Electron
  package-windows:
    needs: build-ui # 必须等待 build-ui 完成
    runs-on: windows-latest
    steps:
      - name: Download UI Artifact
        uses: actions/download-artifact@v4
        with:
          name: perfetto-ui-dist
          path: packer/ui

      - name: Prepare Electron Project
        working-directory: ./packer
        shell: bash # 在 Windows Runner 中强制使用 bash 运行该脚本
        run: |
          cat <<EOF > main.js
          const { app, BrowserWindow } = require("electron");
          const path = require("path");
          function createWindow() {
            const win = new BrowserWindow({
              width: 1600, height: 1000,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadFile(path.join(__dirname, "ui/index.html"));
          }
          app.commandLine.appendSwitch('no-sandbox');
          app.whenReady().then(createWindow);
          EOF
          
          cat <<EOF > package.json
          {
            "name": "perfetto-offline",
            "version": "1.0.0",
            "main": "main.js",
            "scripts": { "build": "electron-builder --win" },
            "build": {
              "appId": "com.perfetto.offline",
              "productName": "PerfettoOffline",
              "directories": { "output": "dist" },
              "files": [ "ui/**/*", "main.js", "package.json" ],
              "win": { "target": "portable" }
            }
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Windows App
        working-directory: ./packer
        run: |
          npm install electron electron-builder --save-dev
          npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfetto-Windows-EXE
          path: packer/dist/*.exe
