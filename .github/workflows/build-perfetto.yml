name: Build and Release Perfetto Offline

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: 

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Perfetto
        uses: actions/checkout@v4
        with:
          repository: google/perfetto
          fetch-depth: 1
          path: perfetto

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv wine64

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Perfetto UI
        working-directory: ./perfetto
        run: |
          # 使用 uv 托管 Python 脚本
          uv run python3 tools/install-build-deps --ui
          ./ui/build

      - name: Prepare Electron Project
        run: |
          mkdir packer
          cp -r perfetto/out/ui/ui/dist ./packer/ui
          cd packer
          
          # 生成主进程文件
          cat <<EOF > main.js
          const { app, BrowserWindow } = require("electron");
          const path = require("path");
          function createWindow() {
            const win = new BrowserWindow({
              width: 1600, height: 1000,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadFile(path.join(__dirname, "ui/index.html"));
          }
          app.commandLine.appendSwitch('no-sandbox');
          app.whenReady().then(createWindow);
          EOF
          
          # 生成打包配置
          cat <<EOF > package.json
          {
            "name": "perfetto-offline",
            "version": "1.0.0",
            "main": "main.js",
            "scripts": { 
              "build": "electron-builder --win" 
            },
            "build": {
              "appId": "com.perfetto.offline",
              "productName": "PerfettoOffline",
              "directories": { "output": "dist" },
              "files": [ "ui/**/*", "main.js", "package.json" ],
              "win": { "target": "portable" }
            }
          }
          EOF
        
      - name: Setup Node.js (Correct Way)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './packer/package.json'

      

      - name: Package Windows App
        working-directory: ./packer
        run: |
          # 使用真正的 npm 安装依赖
          npm install electron electron-builder --save-dev
          npm run build

      - name: Upload Artifact (For Debug)
        uses: actions/upload-artifact@v4
        with:
          name: Perfetto-Windows-EXE
          path: packer/dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packer/dist/*.exe
          generate_release_notes: true
