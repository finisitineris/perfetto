name: Build and Release Perfetto Offline

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的标签时触发，如 v1.0.1
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予创建 Release 的权限

    steps:
      - name: Checkout Perfetto
        uses: actions/checkout@v4
        with:
          repository: google/perfetto
          fetch-depth: 1
          path: perfetto

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv wine64

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Perfetto UI
        working-directory: ./perfetto
        run: |
          uv run python3 tools/install-build-deps --ui
          ./ui/build

      - name: Prepare Electron Project
        run: |
          mkdir packer
          cp -r perfetto/out/ui/ui/dist ./packer/ui
          cd packer
          # 快速生成配置
          cat <<EOF > main.js
          const { app, BrowserWindow } = require("electron");
          const path = require("path");
          function createWindow() {
            const win = new BrowserWindow({
              width: 1600, height: 1000,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadFile(path.join(__dirname, "ui/index.html"));
          }
          app.commandLine.appendSwitch('no-sandbox');
          app.whenReady().then(createWindow);
          EOF
          
          cat <<EOF > package.json
          {
            "name": "perfetto-offline",
            "version": "${{ github.ref_name }}",
            "main": "main.js",
            "scripts": { "build": "electron-builder --win" },
            "build": {
              "appId": "com.perfetto.offline",
              "productName": "PerfettoOffline",
              "directories": { "output": "dist" },
              "files": [ "ui/**/*", "main.js", "package.json" ],
              "win": { "target": "portable" }
            }
          }
          EOF

      - name: Package Windows App
        working-directory: ./packer
        run: |
          uvx --with nodejs npm install electron electron-builder --save-dev
          uvx --with nodejs npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packer/dist/*.exe
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
